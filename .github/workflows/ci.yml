name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar módulos Python de la CLI
        run: python -m compileall -q cli/

      - name: Instalar dependencias de desarrollo
        run: pip install -r requirements-dev.txt

      - name: Suite pytest CLI
        run: python -m pytest cli/tests -q

      - name: Validar instancia SDD (sdd validate)
        run: python cli/sdd.py validate
        # WARN (p. ej. kit-version pre-tag) no falla el job: el CLI sale 0 si solo hay advertencias.

      - name: Validar JSON de agent-prompts
        run: |
          python -c "import json; json.load(open('bootstrap/agent-prompts/manifest.json'))"
          python -c "import json; json.load(open('bootstrap/agent-prompts/stack-descriptions.json'))"
          python -c "import json; json.load(open('bootstrap/agent-skills/manifest.json'))"

      - name: Tests instalación skills
        run: python bootstrap/test_install_skills.py

      - name: Verificar archivos obligatorios por perfil
        run: |
          python <<'PY'
          import sys
          from pathlib import Path

          required = [
              "README.md",
              "sdd.config.yaml",
              "checklist-stack.md",
              "spec-impact.md",
              "deploy.md",
              "release-deploy-section.md",
          ]
          profiles = Path("profiles")
          errors = []
          for profile_dir in sorted(profiles.iterdir()):
              if not profile_dir.is_dir():
                  continue
              for name in required:
                  if not (profile_dir / name).is_file():
                      errors.append(f"{profile_dir.name}: falta {name}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"OK: {len(list(profiles.iterdir()))} perfiles verificados")
          PY
