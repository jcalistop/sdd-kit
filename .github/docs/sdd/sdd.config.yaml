# Instancia SDD del repositorio sdd-kit (dogfooding)
# Ver ADOPTION.md para el plan de adopción y separación producto/proceso.

project:
  name: "SDD Kit"
  development_branch: dev
  production_branch: main

domains:
  - core
  - profiles
  - bootstrap
  - cli
  - docs
  - infra

stack:
  profile: sdd-kit
  ci_workflow: .github/workflows/ci.yml
  quality_gates:
    compile: "python -m compileall -q cli/"
    pytest: "python -m pytest cli/tests -q"
    manifest: 'python -c "import json; json.load(open(''bootstrap/agent-prompts/manifest.json''))"'
    profiles: "verificación archivos obligatorios por perfil (CI)"
    validate_sdd: "python cli/sdd.py validate (local + CI)"
  schema_changes: null
  deploy_platform: github-releases

paths:
  sdd: .github/docs/sdd
  business: .github/docs/business
  contributing: CONTRIBUTING.md

ids:
  next_sdd: 22
  next_adr: 3

release:
  semver: true
  tag_prefix: v

kit:
  installed_version: "v1.4.0"
  installed_at: "2026-09-05"


agent:
  targets: [cursor]
  install_mode: explicit
