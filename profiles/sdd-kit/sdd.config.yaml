# Valores por defecto del perfil sdd-kit (solo repositorio del kit)

stack:
  profile: sdd-kit
  ci_workflow: .github/workflows/ci.yml
  quality_gates:
    compile: "python -m compileall -q cli/"
    pytest: "python -m pytest cli/tests -q"
    manifest: 'python -c "import json; json.load(open(''bootstrap/agent-prompts/manifest.json''))"'
    profiles: "verificación archivos obligatorios por perfil (CI)"
    validate_sdd: "python cli/sdd.py validate (local + CI)"
  schema_changes: null
  deploy_platform: github-releases

domains_suggested:
  - core
  - profiles
  - bootstrap
  - cli
  - docs
  - infra
